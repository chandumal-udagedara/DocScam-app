name: doc_scam_mobile_app
description: "DocScam — Train your scam-spotting skills with real-world quiz scenarios. Covers phishing, job fraud, romance scams, fake investments, and more. By ScamSlayers."
publish_to: 'none'
version: 2.1.0+3

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.2
  google_fonts: ^8.0.2
  shared_preferences: ^2.2.0
  path_provider: ^2.1.0
  share_plus: ^12.0.2
  url_launcher: ^6.3.0
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.2.0
  firebase_analytics: ^12.2.0
  firebase_crashlytics: ^5.1.0
  firebase_messaging: ^16.1.3
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.1
  flutter_lints: ^6.0.0
  mockito: ^5.6.4
  build_runner: ^2.13.1

flutter_launcher_icons:
  image_path: "assets/logo.png"
  android: true
  ios: true
  min_sdk_android: 21

flutter_native_splash:
  color: "#2C0038"
  image: assets/logo.png
  android: true
  ios: true
  android_12:
    color: "#2C0038"
    image: assets/logo.png
    icon_background_color: "#2C0038"

flutter:
  generate: true
  uses-material-design: true

